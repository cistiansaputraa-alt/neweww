<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafael Apps - Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ============================================
       BACKGROUND MEDIA (VIDEO/GAMBAR)
       GANTI src DI BAWAH
       ============================================ */
    .bg-media {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.35;
      filter: blur(2px);
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(10, 10, 15, 0.4), rgba(10, 10, 15, 0.9));
      z-index: 1;
    }

    .loading-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap { margin-bottom: 30px; }
    .logo {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.6),
                  0 0 80px rgba(139, 92, 246, 0.3);
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(139, 92, 246, 0.6), 0 0 80px rgba(139, 92, 246, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(139, 92, 246, 0.9), 0 0 120px rgba(139, 92, 246, 0.5); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px; font-weight: 700;
      color: #fff; margin-bottom: 10px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 30px rgba(139, 92, 246, 0.8);
    }
    .subtitle {
      font-size: 13px; color: #a78bfa;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .spinner {
      width: 60px; height: 60px;
      margin: 0 auto 24px;
      position: relative;
    }
    .spinner::before, .spinner::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }
    .spinner::before {
      border-top-color: #8b5cf6;
      border-right-color: #8b5cf6;
      animation: spin 1s linear infinite;
    }
    .spinner::after {
      border-bottom-color: #ec4899;
      border-left-color: #ec4899;
      animation: spin 1.5s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px; color: #ccc;
      margin-bottom: 16px; min-height: 20px;
    }
    .loading-text::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ""; }
      40% { content: "."; }
      60% { content: ".."; }
      80%, 100% { content: "..."; }
    }

    .progress-bar {
      width: 240px; height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      margin: 0 auto;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      border-radius: 999px;
      transition: width 0.3s ease;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.8);
    }

    .particles { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: #8b5cf6;
      border-radius: 50%;
      box-shadow: 0 0 10px #8b5cf6;
      animation: float 8s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ============================================
       GANTI BACKGROUND MEDIA DI SINI
       OPSI A (VIDEO): <source src="URL_VIDEO.mp4" type="video/mp4">
       OPSI B (GAMBAR): ganti <video> jadi <img class="bg-media" src="URL_GAMBAR.jpg">
       ============================================ -->
  <video class="bg-media" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/7vhmi9.mp4" type="video/mp4">
  </video>

  <div class="bg-overlay"></div>
  <div class="particles" id="particles"></div>

  <div class="loading-content">
    <div class="logo-wrap">
      <!-- GANTI LOGO DI BAWAH -->
      <img src="https://files.catbox.moe/l03t2s.png" class="logo" alt="Logo">
    </div>
    <h1>Rafael Apps</h1>
    <div class="subtitle">Preparing your session</div>

    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Menghubungkan</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 8 + 's';
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      p.style.background = Math.random() > 0.5 ? '#8b5cf6' : '#ec4899';
      p.style.boxShadow = `0 0 10px ${p.style.background}`;
      particlesEl.appendChild(p);
    }

    const progressFill = document.getElementById('progressFill');
    const loadingText = document.getElementById('loadingText');
    const messages = ['Menghubungkan', 'Memuat data akun', 'Menyiapkan dashboard', 'Hampir selesai'];
    let progress = 0;
    let msgIndex = 0;

    const interval = setInterval(() => {
      progress += Math.random() * 15 + 5;
      if (progress > 100) progress = 100;
      progressFill.style.width = progress + '%';

      const newIndex = Math.min(Math.floor(progress / 25), messages.length - 1);
      if (newIndex !== msgIndex) {
        msgIndex = newIndex;
        loadingText.textContent = messages[msgIndex];
      }

      if (progress >= 100) {
        clearInterval(interval);
        setTimeout(() => { window.location.href = '/panel'; }, 400);
      }
    }, 300);

    fetch('/api/user').then(r => {
      if (r.status === 401) window.location.href = '/login';
    }).catch(() => {
      window.location.href = '/login';
    });
  </script>
</body>
</html>
