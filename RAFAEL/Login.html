<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafael - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.35; z-index: 0; }
    .glow-1 { width: 500px; height: 500px; background: #6366f1; top: -200px; left: -100px; }
    .glow-2 { width: 400px; height: 400px; background: #ec4899; bottom: -150px; right: -100px; }

    .card {
      position: relative; z-index: 10;
      background: rgba(20, 20, 28, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 44px 38px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* ============================================
       LETAK LOGO LOGIN
       GANTI src DENGAN LOGO ANDA
       ============================================ */
    .logo {
      width: 70px; height: 70px;
      border-radius: 18px;
      display: block; margin: 0 auto 20px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      text-align: center; font-size: 26px; font-weight: 700;
      color: #fff; letter-spacing: -0.5px; margin-bottom: 6px;
    }
    .sub {
      text-align: center; font-size: 13px;
      color: #888; margin-bottom: 32px;
    }

    .field { position: relative; margin-bottom: 14px; }
    .field i {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      color: #6366f1; font-size: 15px;
    }
    .field input {
      width: 100%;
      padding: 15px 16px 15px 44px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff; font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none; transition: 0.2s;
    }
    .field input:focus {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.05);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .field input::placeholder { color: #555; }

    .btn {
      width: 100%; padding: 15px; margin-top: 12px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: 0.25s;
      letter-spacing: 0.3px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4); }
    .btn:active { transform: translateY(0); }

    .btn-ghost {
      width: 100%; padding: 13px; margin-top: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ccc; border-radius: 12px;
      font-size: 14px; cursor: pointer; transition: 0.25s;
      font-family: 'Inter', sans-serif;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.05); }

    .foot { text-align: center; margin-top: 24px; font-size: 12px; color: #555; }
    .foot span { color: #8b5cf6; }

    .popup {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(20, 20, 28, 0.95);
      backdrop-filter: blur(10px);
      padding: 13px 22px; border-radius: 10px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; opacity: 0;
      transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999; border: 1px solid;
    }
    .popup.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .popup.error { border-color: #ef4444; color: #ef4444; }
    .popup.success { border-color: #10b981; color: #10b981; }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="card">
    <img src="https://files.catbox.moe/zyu4eg.jpg" class="logo" alt="Logo">
    <h1>Rafael Panel</h1>
    <div class="sub">Login untuk melanjutkan</div>

    <div id="popup" class="popup">
      <i class="fa-solid"></i>
      <span id="popupText"></span>
    </div>

    <form action="/auth" method="POST">
      <div class="field">
        <i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="Username" required autocomplete="off" />
      </div>
      <div class="field">
        <i class="fas fa-key"></i>
        <input type="text" name="key" placeholder="Access Key" required autocomplete="off" />
      </div>
      <button type="submit" class="btn">
        <i class="fas fa-arrow-right-to-bracket"></i> Sign In
      </button>
      <button type="button" class="btn-ghost" onclick="window.open('https://t.me/rafael_dev','_blank')">
        <i class="fa-brands fa-telegram"></i> Buy Access
      </button>
      <div class="foot">Powered by <span>Rafael Dev</span></div>
    </form>
  </div>

  <script>
    const msg = new URLSearchParams(window.location.search).get("msg");
    if (msg) showPopup("error", msg);
    function showPopup(type, text) {
      const p = document.getElementById("popup");
      document.getElementById("popupText").textContent = text;
      p.className = "popup " + type;
      p.querySelector("i").className = type === "success"
        ? "fa-solid fa-circle-check" : "fa-solid fa-circle-xmark";
      p.classList.add("show");
      setTimeout(() => p.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>
